[app]
name = "pydfu"
version = "0.1.0"
entry = "src/main.py"

[build]
targets = ["linux-x64", "windows-x64", "macos-x64", "macos-arm64"]

[ui]
renderer = "webview"
root = "ui"
index = "index.html"

[ui.frontend]
framework = "vue"
build_cmd = "npm run build"
dist_dir = "dist"
dev_url = "http://localhost:5173/"

[window]
title = "PyDFU"
size = [1200, 800]
resizable = true

[romfs]
# Include the _usb package directory verbatim so the vendored libusb-1.0.dll
# is bundled in the romfs alongside the _usb Python modules.  On Windows the
# runtime loads the DLL from the same directory as core.py (via __file__).
include = ["src/_usb"]
