# .github/workflows/release.yml
#
# Picolet runtime release pipeline.
#
# Trigger: push of a tag matching runtime-v* (e.g. runtime-v0.1.0).
#
# Produces the 3 × 2 Linux/Windows runtime matrix (NFR-7) plus 3 × 2
# macOS matrix (PH29):
#   {linux-x64, windows-x64} × {cli, webview, lvgl}  — ubuntu-latest
#   {macos-x64, macos-arm64} × {cli, webview, lvgl}   — macos-13/macos-14
#
# macOS builds run on release tags only (NFR-MAC-10: cost ~10× ubuntu-latest).
#
# Each artifact is uploaded to a GitHub Release together with its
# .sha256 and .cdx.json sidecars so PH05's runtime_resolver can
# verify downloads and cache SBOMs automatically.
#
# Permissions: contents: write (to create/update releases and upload assets).
# No registry login required — all Docker images are public.

name: Release runtime artifacts

on:
  push:
    tags:
      - 'runtime-v*'
  # Manual trigger for CI verification (e.g. v1.2 macOS matrix) without
  # cutting a release. Artefacts are still uploaded; no GitHub Release
  # is created when triggered this way (the release job is gated on
  # github.event_name == 'push' with a tag).
  workflow_dispatch:

permissions:
  contents: write       # create releases + upload assets
  pull-requests: write  # screenshots-release job opens a human-review PR

jobs:

  # ---------------------------------------------------------------------------
  # build — 3 variants × 2 targets = 6 parallel jobs
  # ---------------------------------------------------------------------------
  build:
    name: "build ${{ matrix.target }} / ${{ matrix.variant }}"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: [linux-x64, windows-x64]
        variant: [cli, webview, lvgl]
      fail-fast: false

    steps:

      # 1. Checkout with all submodules (micropython + nested deps).
      #    lv_binding_micropython nested submodules are also required for
      #    the lvgl variant; build-runtime.sh initialises them as needed.
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 1b. Compose the micropython integration branch from mbm.toml.
      #     The parent repo records the submodule pointer at a single
      #     reachable feature-branch tip (pr/unix-windows-romfs); the
      #     actual integration branch used by the build is composed
      #     locally from the feature branches via rebuild-integration.sh.
      #     This is intentional: integration is a per-build artefact
      #     by design and is never pushed (see micropython submodule's
      #     CLAUDE.local.md).
      - name: Compose micropython integration branch
        run: |
          bash packages/picolet-runtime/scripts/rebuild-integration.sh

      # 2. Restore caches.
      #
      #    a. Linux build Docker image layers (keyed on Dockerfile SHA).
      #       Absent for windows targets but the cache-from is a no-op
      #       when missed.
      - name: Restore Docker layer cache (linux build image)
        if: matrix.target == 'linux-x64'
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache-linux
          key: docker-linux-build-${{ hashFiles('packages/picolet-runtime/scripts/dockerfiles/linux-x64-build/Dockerfile') }}
          restore-keys: docker-linux-build-

      #    b. SDL2 from-source build — only linux-x64/lvgl and
      #       windows-x64/lvgl need it; the windows one is built inside
      #       dockcross from a tarball.
      - name: Restore SDL2 build cache
        if: matrix.variant == 'lvgl'
        uses: actions/cache@v4
        with:
          path: packages/picolet-runtime/build/sdl2-win64-ffs
          key: sdl2-win64-ffs-${{ hashFiles('packages/picolet-runtime/scripts/build-runtime.sh') }}
          restore-keys: sdl2-win64-ffs-

      #    c. libffi build artifacts (keyed on micropython submodule SHA).
      - name: Restore libffi build cache
        uses: actions/cache@v4
        with:
          path: |
            packages/picolet-runtime/micropython/ports/unix/build-picolet-*/lib/libffi
            packages/picolet-runtime/micropython/ports/windows/build-picolet-*/lib/libffi
          key: libffi-${{ matrix.target }}-${{ matrix.variant }}-${{ hashFiles('packages/picolet-runtime/micropython/lib/libffi/**') }}
          restore-keys: libffi-${{ matrix.target }}-${{ matrix.variant }}-

      # 3. Install host prerequisites.
      #    - docker is pre-installed on ubuntu-latest.
      #    - python3 + mpremote for romfs assembly (host-side).
      #    - gh CLI for release management (pre-installed on ubuntu-latest).
      - name: Install host prerequisites
        run: |
          pip install --quiet mpremote
          python3 -m mpremote --help > /dev/null   # smoke-test

      # 3b. libffi bootstrap toolchain (linux-x64 only).
      #     build-runtime.sh compiles libffi from the bundled submodule for
      #     the ffi-enabled variants.  A fresh checkout has no generated
      #     ./configure, so it must be produced by libffi's autogen.sh,
      #     which requires libtool >= 2.4.7 (the LT_SYS_SYMBOL_USCORE macro).
      #     The ubuntu:22.04 build *container* ships 2.4.6, so the script
      #     runs autogen on the host instead — which needs the host to have
      #     a new-enough libtool.  ubuntu-latest apt provides 2.4.7+.
      #     The macOS job already does the equivalent `brew install libtool`.
      - name: Install libffi bootstrap toolchain (linux-x64 only)
        if: matrix.target == 'linux-x64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libtool automake autoconf

      # 4a. Install a buildx driver that supports --cache-to=type=local.
      #     GitHub's default docker driver only supports the inline cache
      #     backend; --cache-to=type=local needs the docker-container driver
      #     (the default for setup-buildx-action).
      - name: Set up Docker Buildx
        if: matrix.target == 'linux-x64'
        uses: docker/setup-buildx-action@v3

      # 4b. Build the Docker image used for linux-x64 builds.
      #    The image is picolet-linux-x64-build:22.04; build-runtime.sh
      #    also builds it on first use, but building here with explicit
      #    cache allows GitHub Actions to persist and restore image layers.
      - name: Build linux build image (linux-x64 only)
        if: matrix.target == 'linux-x64'
        run: |
          CACHE_DIR=/tmp/docker-cache-linux
          mkdir -p "$CACHE_DIR"
          docker buildx build \
            --cache-from "type=local,src=$CACHE_DIR" \
            --cache-to   "type=local,dest=$CACHE_DIR,mode=max" \
            --load \
            -t picolet-linux-x64-build:22.04 \
            packages/picolet-runtime/scripts/dockerfiles/linux-x64-build

      # 5. Pull dockcross image (windows-x64 only).
      #    Pulling here rather than relying on build-runtime.sh means
      #    the pull error surfaces as a named step rather than inside the
      #    script's stderr.
      - name: Pull dockcross image (windows-x64 only)
        if: matrix.target == 'windows-x64'
        run: |
          docker pull dockcross/windows-static-x64-posix:latest

      # 6. Assert PICOLET_TEST_MODE is not set in the release job environment
      #    (NFR-TEST-2: the debug port must not be enabled in release builds).
      #    A release job that accidentally has PICOLET_TEST_MODE=1 in its env
      #    would expose the CDP/Inspector port in shipped binaries.
      - name: Assert PICOLET_TEST_MODE is not set (NFR-TEST-2)
        run: |
          if env -0 | tr '\0' '\n' | grep -q '^PICOLET_TEST_MODE='; then
            echo "ERROR: PICOLET_TEST_MODE is set in the release build environment." >&2
            echo "Release builds must NOT have PICOLET_TEST_MODE in the environment." >&2
            exit 1
          fi
          echo "OK: PICOLET_TEST_MODE is not set in the release environment."

      # 7. Invoke build-runtime.sh.
      #    The script handles everything: mpy-cross, libffi, romfs,
      #    make, strip, size gate, SBOM emission.
      - name: Build runtime artifact
        run: |
          bash packages/picolet-runtime/scripts/build-runtime.sh \
            --target "${{ matrix.target }}" \
            --variant "${{ matrix.variant }}"

      # 7. Compute SHA256 sidecar.
      #    The resolver (PH05) verifies downloads against this sidecar.
      #    The sidecar format is: <hex-digest>  <filename>  (sha256sum default).
      - name: Compute SHA256 sidecar
        run: |
          cd packages/picolet-runtime/build
          SUFFIX=""
          if [[ "${{ matrix.target }}" == "windows-x64" ]]; then
            SUFFIX=".exe"
          fi
          ARTIFACT="picolet-runtime-${{ matrix.target }}-${{ matrix.variant }}${SUFFIX}"
          sha256sum "$ARTIFACT" > "${ARTIFACT}.sha256"
          echo "sha256sum output:"
          cat "${ARTIFACT}.sha256"

      # 8. Upload all three files for this matrix cell as a job artifact
      #    so the release job can download them all at once.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.target }}-${{ matrix.variant }}
          path: |
            packages/picolet-runtime/build/picolet-runtime-${{ matrix.target }}-${{ matrix.variant }}*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # build-macos — PH29: macos-13 (x64) + macos-14 (arm64) × {cli, webview, lvgl}
  #
  # Runs on release tags only (NFR-MAC-10: cost ~10× ubuntu-latest).
  # FR-CI-MAC-6: first step records sw_vers + uname -m + which clang and
  # uploads the output as macos-runner-info-<runner>.txt for PH25 baseline.
  # 2 os × 3 variants = 6 macOS artifacts per release run.
  # ---------------------------------------------------------------------------
  build-macos:
    name: "build macos-${{ matrix.os == 'macos-13' && 'x64' || 'arm64' }} / ${{ matrix.variant }}"
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-13, macos-14]
        variant: [cli, webview, lvgl]
      fail-fast: false

    steps:

      # FR-CI-MAC-6: record runner OS metadata before any build steps.
      # Output uploaded as an artifact for PH25 WKWebView inspector baseline.
      - name: Record runner OS info (FR-CI-MAC-6)
        run: |
          {
            echo "=== sw_vers ==="
            sw_vers
            echo "=== uname -m ==="
            uname -m
            echo "=== which clang ==="
            which clang
            echo "=== clang --version ==="
            clang --version
          } | tee /tmp/macos-runner-info.txt

      - name: Upload runner OS info artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-runner-info-${{ matrix.os }}-${{ matrix.variant }}
          path: /tmp/macos-runner-info.txt
          retention-days: 90

      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Compose the micropython integration branch from mbm.toml.
      # (See unix build job above for rationale.)
      - name: Compose micropython integration branch
        run: |
          bash packages/picolet-runtime/scripts/rebuild-integration.sh

      # Install automake + libtool for all variants; add sdl2 for lvgl.
      - name: Install brew dependencies
        run: |
          brew install automake libtool
          if [[ "${{ matrix.variant }}" == "lvgl" ]]; then
            brew install sdl2
          fi

      - name: Install host prerequisites (mpremote)
        run: pip3 install --quiet mpremote

      - name: Restore libffi build cache
        uses: actions/cache@v4
        with:
          path: |
            packages/picolet-runtime/micropython/ports/unix/build-picolet-*/lib/libffi
          key: >-
            libffi-macos-${{ matrix.os == 'macos-13' && 'x64' || 'arm64' }}-${{ matrix.variant }}-${{
              hashFiles(
                'packages/picolet-runtime/micropython/lib/libffi/**'
              )
            }}
          restore-keys: libffi-macos-${{ matrix.os == 'macos-13' && 'x64' || 'arm64' }}-${{ matrix.variant }}-

      # NFR-TEST-2: PICOLET_TEST_MODE must not be set in release builds.
      - name: Assert PICOLET_TEST_MODE is not set (NFR-TEST-2)
        run: |
          if env -0 | tr '\0' '\n' | grep -q '^PICOLET_TEST_MODE='; then
            echo "ERROR: PICOLET_TEST_MODE set in release environment." >&2
            echo "Release builds must NOT have PICOLET_TEST_MODE set." >&2
            exit 1
          fi
          echo "OK: PICOLET_TEST_MODE is not set."

      - name: Build runtime
        run: |
          ARCH=$([ "${{ runner.arch }}" = "X64" ] && echo "x64" || echo "arm64")
          bash packages/picolet-runtime/scripts/build-runtime.sh \
            --target "macos-${ARCH}" \
            --variant "${{ matrix.variant }}"

      - name: Compute SHA256 sidecar
        run: |
          cd packages/picolet-runtime/build
          ARCH=$([ "${{ runner.arch }}" = "X64" ] && echo "x64" || echo "arm64")
          ARTIFACT="picolet-runtime-macos-${ARCH}-${{ matrix.variant }}"
          sha256sum "$ARTIFACT" > "${ARTIFACT}.sha256"
          echo "sha256sum output:"
          cat "${ARTIFACT}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runtime-macos-${{ matrix.os == 'macos-13' && 'x64' || 'arm64' }}-${{ matrix.variant }}
          path: |
            packages/picolet-runtime/build/picolet-runtime-macos-*-${{ matrix.variant }}*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # release — runs once after all build jobs complete
  # ---------------------------------------------------------------------------
  release:
    name: "Publish GitHub Release"
    runs-on: ubuntu-latest
    needs: [build, build-macos]
    # Only publish a real Release on a runtime-v* tag push.  On
    # workflow_dispatch (CI verification path), artefacts are uploaded but
    # no Release object is created.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/runtime-v')

    steps:

      # 1. Lightweight checkout — only needs gh CLI and tag name.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Download all artifacts produced by the build matrix.
      #    Each artifact is named runtime-<target>-<variant> and lands
      #    under a subdirectory of the same name.
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      # 3. List what arrived (visible in the Actions log for debugging).
      - name: List downloaded artifacts
        run: find dist/ -type f | sort

      # 4. Create the GitHub Release (idempotent: --notes-file is
      #    optional; existing releases are updated, not duplicated).
      #    The tag name is available as GITHUB_REF_NAME on tag push events.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; will add/update assets"
          else
            NOTES="Runtime artifacts for picolet ${TAG}."$'\n\n'
            NOTES+="Each artifact is accompanied by:"$'\n'
            NOTES+="- \`.sha256\` — SHA256 digest for integrity verification by \`picolet build\`."$'\n'
            NOTES+="- \`.cdx.json\` — CycloneDX 1.5 SBOM listing all statically-linked components."$'\n\n'
            NOTES+="See [RELEASING.md](https://github.com/${REPO}/blob/main/RELEASING.md) for the release process."
            gh release create "$TAG" \
              --title "Picolet runtime ${TAG}" \
              --notes "${NOTES}" \
              --draft=false \
              --prerelease=false
          fi

      # 5. Upload all artifacts to the release.
      #    gh release upload supports globs and multiple paths.
      #    --clobber replaces any existing asset of the same name so
      #    re-running the workflow on the same tag is idempotent.
      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Collect every file under dist/ into a flat list.
          # The download-artifact step creates one subdirectory per artifact name.
          mapfile -t FILES < <(find dist/ -type f | sort)
          echo "Uploading ${#FILES[@]} files to release $TAG"
          gh release upload "$TAG" "${FILES[@]}" --clobber

  # ---------------------------------------------------------------------------
  # screenshots-release — regenerate example screenshots at release time and
  # open a human-review PR. Auto-merge is OFF; a reviewer must inspect the
  # visual diff before merging.
  # ---------------------------------------------------------------------------
  screenshots-release:
    name: "Regenerate screenshots for release"
    runs-on: ubuntu-latest
    needs: build
    # Same gating as `release`: only run on a real tag push.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/runtime-v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Playwright Chromium
        run: uv run --with playwright playwright install chromium --with-deps

      - name: Build and regenerate screenshots (pydfu)
        run: |
          npm --prefix examples/pydfu ci
          npm --prefix examples/pydfu run build
          uv run examples/pydfu/scripts/generate_screenshots.py

      - name: Build and regenerate screenshots (notes)
        run: |
          npm --prefix examples/notes ci
          npm --prefix examples/notes run build
          uv run examples/notes/scripts/generate_screenshots.py

      - name: Build and regenerate screenshots (config-editor)
        run: |
          npm --prefix examples/config-editor ci
          npm --prefix examples/config-editor run build
          uv run examples/config-editor/scripts/generate_screenshots.py

      - name: Build and regenerate screenshots (dashboard)
        run: |
          npm --prefix examples/dashboard ci
          npm --prefix examples/dashboard run build
          uv run examples/dashboard/scripts/generate_screenshots.py

      - name: Assert all screenshots directories are non-empty
        run: |
          for dir in examples/pydfu/screenshots examples/notes/screenshots \
                     examples/config-editor/screenshots examples/dashboard/screenshots; do
            count=$(find "$dir" -name "*.png" | wc -l)
            if [[ "$count" -eq 0 ]]; then
              echo "ERROR: no PNGs in $dir" >&2
              exit 1
            fi
            echo "OK: $dir has $count PNG(s)"
          done

      - name: Commit and push updated screenshots to sidecar branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          BRANCH="screenshots-${TAG}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add examples/pydfu/screenshots/ \
                  examples/notes/screenshots/ \
                  examples/config-editor/screenshots/ \
                  examples/dashboard/screenshots/
          git commit --allow-empty -m "[release] Regenerate screenshots for ${TAG}"
          git push origin "HEAD:${BRANCH}" --force

      - name: Open human-review PR (auto-merge OFF)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          BRANCH="screenshots-${TAG}"
          # gh pr create is idempotent against the same branch; --no-fill avoids
          # pulling in commit messages as the body.
          gh pr create \
            --title "screenshots: regenerate for ${TAG}" \
            --body "Auto-generated screenshot update for release ${TAG}. Review visual changes before merging." \
            --base dev \
            --head "${BRANCH}" \
            || echo "PR already exists for ${BRANCH} — skipping create"
