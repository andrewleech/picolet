name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      sast_scanner:
        description: SAST scanner to run
        required: true
        type: choice
        default: opengrep-stable
        options:
          - opengrep-stable
          - opengrep-interfile-alpha
          - semgrep-ce
          - ruff-s
          - pyrefly
          - pysa

permissions:
  contents: read

jobs:
  lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff==0.16.8

      - name: Lint changed Python files
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$EVENT_BASE"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base="$EVENT_BEFORE"
          else
            base="$(git rev-parse "$EVENT_HEAD^" 2>/dev/null || true)"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse "$EVENT_HEAD^" 2>/dev/null || true)"
          fi
          if [[ -z "$base" ]]; then
            echo "No parent commit available for changed-file linting."
            exit 1
          fi
          mapfile -t files < <(git diff --diff-filter=ACMR --name-only "$base" "$EVENT_HEAD" -- '*.py')
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No changed Python files to lint."
            exit 0
          fi
          ruff check --isolated --select E,F --ignore E501,E402,E701,E741,F401,F841 "${files[@]}"

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3
        with:
          version: 0.12.17

      - name: Install workspace test dependencies
        run: uv sync --locked --all-packages --all-extras --group dev

      - name: Test host packages
        run: >-
          uv run --no-sync pytest
          tests/phase-05/
          tests/phase-13/
          tests/phase-17/
          tests/phase-19/
          tests/phase-20/
          tests/phase-21/
          tests/phase-23/
          -q

      - name: Test MicroPython IPC runtime
        env:
          PYTHONPATH: packages/picolet-runtime/python
        run: uv run --no-sync pytest tests/phase-06/ tests/phase-07/ tests/phase-11/ -q

      - name: Test runtime system API
        run: uv run --no-sync pytest tests/system/ -q

      - name: Test terminal UI
        run: uv run --no-sync pytest tests/system/tui/ -q

  sast:
    name: "SAST ${{ matrix.target }} / ${{ matrix.variant }}"
    runs-on: ${{ matrix.target == 'macos-x64' && 'macos-15-intel' || matrix.target == 'macos-arm64' && 'macos-14' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.sast_scanner == 'opengrep-interfile-alpha' && '["linux-x64","windows-x64"]' || '["linux-x64","windows-x64","macos-x64","macos-arm64"]') }}
        variant: [cli, webview, lvgl, mcp, tui]
        exclude:
          - { target: windows-x64, variant: mcp }
          - { target: macos-x64, variant: mcp }
          - { target: macos-x64, variant: tui }
          - { target: macos-arm64, variant: mcp }
          - { target: macos-arm64, variant: tui }
    env:
      SAST_SCANNER: ${{ inputs.sast_scanner || 'opengrep-stable' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compose MicroPython integration
        run: bash packages/picolet-runtime/scripts/rebuild-integration.sh

      - name: Install build prerequisites
        run: |
          python3 -m pip install mpremote pytest
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            brew install automake libtool
            if [[ "${{ matrix.variant }}" == "lvgl" ]]; then
              brew install sdl2
            fi
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libtool automake autoconf
            if [[ "${{ matrix.target }}" == "windows-x64" ]]; then
              docker pull dockcross/windows-static-x64-posix:latest
            fi
          fi

      - name: Test source scope and analysis status
        run: python3 -m pytest tests/phase-31/ -q

      - name: Install Opengrep stable
        if: env.SAST_SCANNER == 'opengrep-stable'
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            curl -fsSL https://github.com/opengrep/opengrep/releases/download/v1.30.0/opengrep_manylinux_x86 -o opengrep
            echo "35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c  opengrep" | sha256sum --check
          elif [[ "$(uname -m)" == "arm64" ]]; then
            curl -fsSL https://github.com/opengrep/opengrep/releases/download/v1.30.0/opengrep-core_osx_aarch64.tar.gz -o opengrep.tar.gz
            echo "c5666ba7cec84ed60e101b84f9d489ba3d4320e35f258ec9a078ebc3ef3152b3  opengrep.tar.gz" | shasum -a 256 --check
            tar -xzf opengrep.tar.gz
          else
            curl -fsSL https://github.com/opengrep/opengrep/releases/download/v1.30.0/opengrep-core_osx_x86.tar.gz -o opengrep.tar.gz
            echo "9c382b3f7979963edf05e085e943b3c850470bd5ca114b67e3f40514c99b56b8  opengrep.tar.gz" | shasum -a 256 --check
            tar -xzf opengrep.tar.gz
          fi
          chmod +x opengrep
          sudo install -m 0755 opengrep /usr/local/bin/opengrep

      - name: Install Opengrep interfile alpha
        if: env.SAST_SCANNER == 'opengrep-interfile-alpha'
        run: |
          curl -fsSL https://github.com/opengrep/opengrep/releases/download/v2.0.0-nopython-interfile.alpha.3/opengrep_linux_x86 -o opengrep
          echo "c974a8d6918a49ae340fad22913b131d0e20d8cd6682e4890ef057f4e29d6184  opengrep" | sha256sum --check
          chmod +x opengrep
          sudo install -m 0755 opengrep /usr/local/bin/opengrep

      - name: Install Semgrep CE
        if: env.SAST_SCANNER == 'semgrep-ce'
        run: python3 -m pip install semgrep==1.179.0

      - name: Install Ruff security rules
        if: env.SAST_SCANNER == 'ruff-s'
        run: python3 -m pip install ruff==0.16.8

      - name: Install Pyrefly
        if: env.SAST_SCANNER == 'pyrefly' || env.SAST_SCANNER == 'pysa'
        run: python3 -m pip install pyrefly==1.3.2

      - name: Install Pysa
        if: env.SAST_SCANNER == 'pysa'
        run: python3 -m pip install pyre-check==0.10.0

      - name: Build native runtime and record compiler inputs
        run: |
          compile_log="$PWD/packages/picolet-runtime/build/native-compile.jsonl"
          bash packages/picolet-runtime/scripts/build-runtime.sh \
            --target "${{ matrix.target }}" \
            --variant "${{ matrix.variant }}" \
            --compile-db-log "$compile_log"
          echo "compile_log=$compile_log" >> "$GITHUB_ENV"

      - name: Normalise native compile database
        run: |
          mkdir -p sast-results
          python3 scripts/normalise_compile_database.py \
            --repo-root "$PWD" \
            --input "$compile_log" \
            --output sast-results/compile_commands.json

      - name: Check positive and negative fixtures
        run: python3 scripts/check_sast_fixtures.py --scanner "$SAST_SCANNER"

      - name: Run selected static analysis
        run: |
          python3 scripts/run_sast.py \
            --scanner "$SAST_SCANNER" \
            --target "${{ matrix.target }}" \
            --variant "${{ matrix.variant }}" \
            --compile-database sast-results/compile_commands.json \
            --output-dir sast-results

      - name: Upload analysis reports and inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-${{ matrix.target }}-${{ matrix.variant }}-${{ env.SAST_SCANNER }}
          path: sast-results/
          if-no-files-found: ignore
          retention-days: 14
