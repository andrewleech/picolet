[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "picolet-testing"
version = "0.1.0"
description = "Host-side test harness for Picolet apps (AppHarness, WebKit/CDP drivers)"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "websockets>=12.0",
    "pillow>=10.0",
]

[tool.hatch.build.targets.wheel]
# PEP 420 namespace package: the picolet/ directory is declared as a namespace
# package so it composes with other picolet.* distributions on the host.
packages = ["picolet"]
