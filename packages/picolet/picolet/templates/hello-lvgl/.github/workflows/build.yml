name: Build and release Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Picolet from the current development branch
        run: uv tool install --from "git+https://github.com/andrewleech/picolet.git@dev#subdirectory=packages/picolet" picolet
      - name: Install mpy-cross
        run: uv tool install mpy-cross
      - name: Build app
        run: picolet build --target windows-x64
      - name: Upload executable and sidecars
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: target/windows-x64/**
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find dist -type f -print0 | sort -z)
          test "${#files[@]}" -gt 0
          gh release create "$GITHUB_REF_NAME" --generate-notes "${files[@]}"
